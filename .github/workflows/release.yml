name: Release

# Push a tag like v0.3.0 (matching package.json's version) on a commit that is on main to publish to npm. A tag on any
# other branch stops here. Every check and the browser tests run first; npm records where the package was built
# (provenance).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so the check below can see main
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag matches the version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: bun run bench
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
